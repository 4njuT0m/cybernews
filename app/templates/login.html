{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto; text-align: center;">
    <h2>SOC Authentication</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Authorized personnel only. All access is logged.</p>
    
    {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--critical); color: var(--critical); padding: 0.75rem; border-radius: 4px; margin-bottom: 1.5rem;">
            {{ error }}
        </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('auth.login') }}" style="text-align: left;">
        <div style="margin-bottom: 1rem;">
            <label style="font-size: 0.85rem; color: var(--text-muted);">Operator ID (Username)</label><br>
            <input type="text" name="username" required style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="font-size: 0.85rem; color: var(--text-muted);">Passphrase</label><br>
            <input type="password" name="password" required style="width: 100%; box-sizing: border-box;">
        </div>
        <button type="submit" style="width: 100%; padding: 0.75rem;">INITIATE SESSION</button>
    </form>
</div>
{% endblock %}
