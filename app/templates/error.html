{% extends "base.html" %}
{% block content %}
<div style="text-align:center; padding: 4rem 2rem;">
  <h1 style="font-size: 5rem; color: var(--critical); margin:0">{{ code }}</h1>
  <h2 style="margin: 1rem 0">{{ title }}</h2>
  <p style="color: var(--text-muted)">{{ message }}</p>
  <a href="{{ url_for('news.index') }}" style="margin-top:2rem; display:inline-block">← Return to Dashboard</a>
</div>
{% endblock %}
